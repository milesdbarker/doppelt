[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doppelt"
version = "0.1.0"
description = "Game engine and AI agent for Doppelt So Clever"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
ml = [
    "numpy>=1.26",
    "torch>=2.2",
    "pyarrow>=15.0",  # Parquet datasets
]
all = [
    "doppelt[dev,ml]",
]

[project.scripts]
doppelt = "doppelt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
